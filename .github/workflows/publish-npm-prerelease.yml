name: Publish npm distribution

on:
  workflow_dispatch:
    inputs:
      channel:
        description: next publishes prereleases; candidate publishes stable without changing latest; latest promotes existing identical stable artifacts
        type: choice
        options: [next, candidate, latest]
        default: next
        required: true
      confirm_version:
        description: Exact package version; required for candidate/latest
        type: string
        required: false
      candidate_run_id:
        description: Successful candidate workflow run ID containing original tarballs; required for latest
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: npm-distribution
  cancel-in-progress: false

env:
  OCTOBER_BUS_NPM_CHANNEL: ${{ inputs.channel }}
  OCTOBER_BUS_CONFIRM_VERSION: ${{ inputs.confirm_version }}

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.channel != 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.provenance.outputs.packages }}
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Verify reviewed release commit
        run: node scripts/release-policy.mjs
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate publication channel before building
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import { validateChannel } from "../../scripts/publish-npm.mjs"; import { manifest } from "../../scripts/npm-distribution.mjs"; validateChannel(manifest.version, process.env.OCTOBER_BUS_NPM_CHANNEL); if (process.env.OCTOBER_BUS_NPM_CHANNEL !== "next") assert.equal(process.env.OCTOBER_BUS_CONFIRM_VERSION, manifest.version);'
      - run: go test -race -count=1 ./...
        working-directory: .
      - run: go vet ./...
        working-directory: .
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:errors
      - run: npm run test:release
      - run: npm run build:native -- --all
      - run: npm run test:integration
        env:
          OCTOBER_BUS_BINARY: ${{ github.workspace }}/dist/npm/linux-x64/bin/agentintercom
      - run: npm run pack:distribution -- --all
      - name: Identify the checked tarballs for provenance
        id: provenance
        working-directory: .
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { basename } from 'node:path'
          import { manifest, targets, packageFor, readArtifact } from './scripts/npm-distribution.mjs'
          const names = [...targets.map(target => packageFor(target).name), manifest.name]
          const packages = names.map(name => {
            const { file, integrity } = readArtifact(name)
            return {
              file: basename(file),
              subject: `pkg:npm/${name.replace('@', '%40')}@${manifest.version}`,
              digest: `sha512:${Buffer.from(integrity.slice('sha512-'.length), 'base64').toString('hex')}`
            }
          })
          console.log(`packages=${JSON.stringify(packages)}`)
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-distribution
          path: dist/npm/*.tgz*
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-distribution
          path: dist/npm
      - run: npm run test:distribution
        working-directory: sdk/typescript

  provenance:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.build.outputs.packages) }}
    steps:
      - name: Attest the checked npm tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.package.subject }}
          subject-digest: ${{ matrix.package.digest }}
      - name: Name the portable provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TARBALL_NAME: ${{ matrix.package.file }}
        run: cp "$BUNDLE_PATH" "${TARBALL_NAME}.sigstore"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-provenance-${{ strategy.job-index }}
          path: '*.tgz.sigstore'
          if-no-files-found: error

  publish:
    needs: [build, smoke, provenance]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-distribution
          path: dist/npm
      - name: Publish or promote native packages first, then CLI and SDK
        run: npm run publish:distribution
        working-directory: sdk/typescript

  promote:
    if: github.ref == 'refs/heads/main' && inputs.channel == 'latest'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify reviewed evidence/promotion commit
        run: node scripts/release-policy.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require separately approved dist-tag authority
        run: node -e 'if (!process.env.NODE_AUTH_TOKEN) throw new Error("Configure a narrowly scoped NPM_DIST_TAG_TOKEN in the protected npm environment; OIDC publish authority cannot update dist-tags")'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
      - name: Validate original candidate run
        id: candidate
        run: node scripts/candidate-run.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          OCTOBER_BUS_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      - name: Verify reviewed original candidate commit
        run: node scripts/release-policy.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.candidate.outputs.candidate_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          path: candidate-source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-distribution
          path: dist/npm
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - run: node --test scripts/publish-npm.test.mjs scripts/candidate-run.test.mjs scripts/check-compatibility.test.mjs
      - name: Promote original checked artifacts after exact-version launch-core evidence
        run: npm run publish:distribution
        working-directory: sdk/typescript
        env:
          OCTOBER_BUS_CANDIDATE_SOURCE: ${{ github.workspace }}/candidate-source
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
